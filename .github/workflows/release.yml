name: Release & Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Release (Linux x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Slint, GUI & AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev librsvg2-bin libfuse2 wget

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build in Release mode
        run: cargo build --release --locked

      - name: Test binary execution
        run: ./target/release/agychat --help

      - name: Package AppImage and Tarball
        run: |
          chmod +x package_appimage.sh install.sh uninstall.sh
          ./package_appimage.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agychat-linux-x86_64-packages
          path: |
            dist/agychat-x86_64.AppImage
            dist/agychat-linux-x86_64.tar.gz

      - name: Create or Update GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agychat-x86_64.AppImage
            dist/agychat-linux-x86_64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Chat bubble 1 (Main base) -->
  <path d="M34 38 C34 30.268 40.268 24 48 24 L80 24 C87.732 24 94 30.268 94 38 L94 62 C94 69.732 87.732 76 80 76 L62 76 L44 90 L44 76 L48 76 C40.268 76 34 69.732 34 62 Z" 
        fill="url(#accentGrad)" opacity="0.9" filter="url(#glow)"/>

  <!-- Forking branch node icon in center of bubble -->
  <!-- Top node -->
  <circle cx="64" cy="40" r="5" fill="#ffffff"/>
  <!-- Branch lines -->
  <path d="M64 45 L64 54 M64 54 L52 64 M64 54 L76 64" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom left node -->
  <circle cx="52" cy="65" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Bottom right node -->
  <circle cx="76" cy="65" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Small spark in corner -->
  <polygon points="98,22 100,28 106,30 100,32 98,38 96,32 90,30 96,28" fill="#38bdf8" opacity="0.85"/>
</svg>

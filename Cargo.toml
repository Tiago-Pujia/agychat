[package]
name = "agychat"
version = "2.0.3"
edition = "2021"
description = "Antigravity Chat Manager — CLI & Slint Desktop GUI"
authors = ["Tiago Pujia"]

[[bin]]
name = "agychat"
path = "src/main.rs"

[dependencies]
slint = { version = "1.9", default-features = true }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
flate2 = "1.0"
tempfile = "3.13"
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
regex = "1.11"
urlencoding = "2.1"
dirs = "5.0"
rfd = "0.15"
arboard = "3.4"
open = "5.3"
sysinfo = "0.40.4"

[build-dependencies]
slint-build = "1.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
